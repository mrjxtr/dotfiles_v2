#
# Ly-style minimal theme: white on black, Terminus, no decorations.
# Previous ml4w theme saved as hyprlock.conf.ml4w-backup

general {
    ignore_empty_input = true
    hide_cursor = true
}

# ly has no animations, so neither do we
animations {
    enabled = false
}

background {
    monitor =
    color = rgb(0, 0, 0)
}

# two-column layout like ly: labels left, values right
# positions are offsets of each widget's center, so they compensate for text width
label {
    monitor =
    text = login
    color = rgb(255, 255, 255)
    font_size = 18
    font_family = Terminus Bold
    position = -120, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(255, 255, 255)
    font_size = 18
    font_family = Terminus Bold
    position = 18, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = password
    color = rgb(255, 255, 255)
    font_size = 18
    font_family = Terminus Bold
    position = -102, -30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 220, 30
    position = 88, -30
    halign = center
    valign = center
    outline_thickness = 0
    rounding = 0
    outer_color = rgb(0, 0, 0)
    inner_color = rgb(0, 0, 0)
    font_color = rgb(255, 255, 255)
    font_family = Terminus Bold
    dots_size = 0.5
    dots_spacing = 0.2
    dots_center = false
    dots_text_format = *
    placeholder_text =
    fade_on_empty = false
    hide_input = false
    check_color = rgb(0, 0, 0)
    fail_color = rgb(255, 0, 0)
    fail_text = $FAIL
    fail_transition = 100
    shadow_passes = 0
}
